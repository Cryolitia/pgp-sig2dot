[package]
name = "pgp-sig2dot"
version.workspace = true
edition.workspace = true
description.workspace = true
homepage.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
categories = ["visualization"]

[dependencies]
anyhow = { version = "1.0.104", features = ["backtrace"] }
futures = "0.3.34"
log = "0.4.35"
num_enum = { version = "0.7.6", features = ["complex-expressions"] }
serde = { version = "1.0.229", features = ["derive", "rc"] }
serde_json = "1.0.154"
serialize_display_adapter_macro_derive = "0.2.0"
sequoia-wot = "0.15.3"
sequoia-openpgp = { version = "2.4.2", default-features = false }
sequoia-net = "0.31.0"
clap = { version = "4.6.7", features = ["cargo"] }
reqwest = "0.13.5"

[features]
default = ["sequoia-openpgp/default"]

# but allow others to select a different backend, as well
crypto-nettle = ["sequoia-openpgp/crypto-nettle"]
crypto-openssl = ["sequoia-openpgp/crypto-openssl"]
crypto-botan = ["sequoia-openpgp/crypto-botan"]
crypto-botan2 = ["sequoia-openpgp/crypto-botan2"]
crypto-rust = ["sequoia-openpgp/crypto-rust"]
crypto-cng = ["sequoia-openpgp/crypto-cng"]

# Experimental and variable-time cryptographic backend opt-ins
allow-experimental-crypto = ["sequoia-openpgp/allow-experimental-crypto"]
allow-variable-time-crypto = ["sequoia-openpgp/allow-variable-time-crypto"]


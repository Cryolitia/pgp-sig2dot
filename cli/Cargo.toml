[package]
name = "pgp-sig2dot-cli"
version.workspace = true
edition.workspace = true
description.workspace = true
homepage.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
categories = ["command-line-utilities", "visualization"]

[[bin]]
name = "pgp-sig2dot"
path = "src/main.rs"

[features]
map42 = [ "rustworkx-core" ]
nix = [ "rnix" ]

[dependencies]
pgp-sig2dot = { path = "../lib", version = "0.4.4" }
anyhow = { version = "1.0.104", features = ["backtrace"] }
clap = { version = "4.6.7", features = ["derive", "cargo"] }
clap-verbosity-flag = "3.0.4"
clap_complete = "4.6.11"
clap_mangen = "0.3.3"
clio = { version = "0.3.5", features = ["clap-parse", "curl", "http-curl"] }
env_logger = "0.11.11"
log = "0.4.35"
petgraph = { version = "0.8.3", features = ["rayon", "graphmap"], default-features = false }
serde = { version = "1.0.229", features = ["derive", "rc"] }
serde_json = "1.0.154"
tokio = { version = "1.54.1", features = ["macros", "rt-multi-thread"] }
sequoia-openpgp = { version = "2.4.2", default-features = false }
sequoia-net = "0.31.0"
format = "0.2.4"
futures = "0.3.34"
validator = "0.21.0"
reqwest = "0.13.5"
serialize_display_adapter_macro_derive = "0.2.0"
rustworkx-core = {  version = "0.18.1", optional = true }
rnix = { version = "0.15.1", optional = true }
